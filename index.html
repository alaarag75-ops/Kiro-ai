<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIRO AI | Vercel Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090314; color: #f3e8ff; }
        .kiro-card {
            background: rgba(22, 8, 41, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .kiro-input {
            background: rgba(14, 4, 28, 0.95); border: 1px solid rgba(168, 85, 247, 0.4); color: #fff;
        }
        .kiro-input:focus { border-color: #c084fc; outline: none; }
        .glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-4 select-none relative">

    <header class="w-full kiro-card sticky top-0 z-30 p-3.5 border-b border-purple-500/30">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-700 via-fuchsia-600 to-violet-500 flex items-center justify-center text-white text-xl font-black glow-purple">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg text-white tracking-wider flex items-center gap-1.5">
                        KIRO AI <span id="userTierBadge" class="text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/40 px-2 py-0.5 rounded-full">Vercel Serverless</span>
                    </h1>
                </div>
            </div>
            <button onclick="togglePremium()" id="premToggleBtn" class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl font-bold">
                تفعيل Ultra Premium ⚡
            </button>
        </div>
    </header>

    <main class="max-w-2xl w-full mx-auto p-3 flex-1 flex flex-col justify-between space-y-4">
        
        <div id="chatBox" class="kiro-card rounded-3xl p-4 flex-1 min-h-[420px] max-h-[500px] overflow-y-auto space-y-3 border-purple-500/30">
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white text-xs font-black shrink-0">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <div class="kiro-card p-3 rounded-2xl rounded-tr-none text-xs text-purple-100 max-w-[85%] space-y-1">
                    <span class="font-bold text-purple-300 block">KIRO AI</span>
                    <p>أهلاً بك! الموقع والسيرفر شغالين الآن على Vercel، جاهز لتلقي أوامرك مباشرة 🚀</p>
                </div>
            </div>
        </div>

        <div class="kiro-card rounded-2xl p-2.5 flex items-center gap-2 border-purple-500/40">
            <textarea id="userInput" rows="1" placeholder="اطلب أي شيء من KIRO..." class="w-full kiro-input rounded-xl px-3.5 py-2.5 text-xs resize-none max-h-24"></textarea>
            <button onclick="sendMessage()" class="w-11 h-11 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 text-white font-black text-sm flex items-center justify-center shrink-0">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

    </main>

    <script>
        let isPremiumUser = false;

        function togglePremium() {
            isPremiumUser = !isPremiumUser;
            const btn = document.getElementById('premToggleBtn');
            const badge = document.getElementById('userTierBadge');

            if (isPremiumUser) {
                btn.innerText = "تعطيل البريميوم";
                btn.className = "text-xs bg-purple-600 text-white px-3 py-1.5 rounded-xl font-bold";
                badge.innerText = "ULTRA PREMIUM ⚡";
                badge.className = "text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold animate-pulse";
            } else {
                btn.innerText = "تفعيل Ultra Premium ⚡";
                btn.className = "text-xs bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl font-bold";
                badge.innerText = "Vercel Serverless";
                badge.className = "text-[10px] bg-purple-500/20 text-purple-300 border border-purple-500/40 px-2 py-0.5 rounded-full";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            const chatBox = document.getElementById('chatBox');

            // إظهار رسالة المستخدم
            chatBox.innerHTML += `
                <div class="flex items-start justify-end gap-2.5">
                    <div class="bg-purple-600/40 border border-purple-500/40 p-3 rounded-2xl text-xs text-white max-w-[85%]">
                        <p>${escapeHtml(msg)}</p>
                    </div>
                </div>
            `;

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // مؤشر التحميل
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white text-xs font-black shrink-0">
                        <i class="fa-solid fa-dragon ${isPremiumUser ? 'animate-bounce text-amber-300' : 'animate-spin'}"></i>
                    </div>
                    <div class="kiro-card p-3 rounded-2xl text-xs text-purple-300 italic">
                        ${isPremiumUser ? '⚡ [KIRO Ultra Engine] جاري المعالجة بأقصى قوة...' : 'جاري الاتصال بالسيرفر...'}
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // الاتصال بـ API Vercel الداخلي المباشر
                const response = await fetch('/api/kiro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: msg,
                        isPremium: isPremiumUser
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.status) {
                    chatBox.innerHTML += `
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 rounded-xl ${isPremiumUser ? 'bg-gradient-to-tr from-amber-500 to-purple-600' : 'bg-purple-600'} flex items-center justify-center text-white text-xs font-black shrink-0 shadow-lg">
                                <i class="fa-solid fa-dragon"></i>
                            </div>
                            <div class="kiro-card p-3 rounded-2xl text-xs text-purple-100 max-w-[85%] space-y-1 ${isPremiumUser ? 'border-amber-500/40' : ''}">
                                <span class="font-bold ${isPremiumUser ? 'text-amber-300' : 'text-purple-300'} block">
                                    KIRO AI ${isPremiumUser ? '⚡ ULTRA' : ''}
                                </span>
                                <div class="whitespace-pre-line leading-relaxed">${escapeHtml(data.result)}</div>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error();
                }

            } catch (err) {
                if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="kiro-card p-3 rounded-2xl text-xs text-red-300 border-red-500/30">
                        حدث خطأ أثناء الاتصال بسيرفر Vercel!
                    </div>
                `;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
                                  </html>
